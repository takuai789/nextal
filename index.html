<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="NEXTAL" />
<meta name="theme-color" content="#F2F4F8" />
<link rel="manifest" href="manifest.webmanifest" />
<link rel="apple-touch-icon" href="icon-v1-192.png" />
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%232F6FDB'/%3E%3Crect x='22' y='26' width='56' height='50' rx='9' fill='%23fff'/%3E%3Crect x='22' y='26' width='56' height='13' rx='6' fill='%23CFE0FA'/%3E%3Ccircle cx='36' cy='55' r='5' fill='%232F6FDB'/%3E%3Ccircle cx='66' cy='55' r='6' fill='%23FFB020'/%3E%3C/svg%3E" />
<title>NEXTAL</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+1p:wght@400;500;700;800&display=swap" rel="stylesheet" />
<style>
  :root {
    color-scheme: light;
    --bg: #F2F4F8; --card: #FFFFFF; --field: #E7EBF2;
    --ink: #1B2130; --secondary: rgba(27,33,48,0.58); --tertiary: rgba(27,33,48,0.34); --sep: rgba(27,33,48,0.09);
    --accent: #2F6FDB; --accent-soft: #E4EDFC; --orange: #FFA51F;
    --ok: #1B9E8A; --ok-soft: #D7F2EC; --ok-ink: #127A6A;
    --mid: #E0A800; --mid-soft: #FFF5D6; --mid-ink: #8A6800;
    --ng: #EF6A2E; --ng-soft: #FFEBE0; --ng-ink: #B4461A;
    --red: #E5484D;
    --shadow: 0 1px 2px rgba(20,25,40,0.06);
    --safe-top: env(safe-area-inset-top, 0px); --safe-bottom: env(safe-area-inset-bottom, 0px);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; overflow: hidden; background: var(--bg); }
  body { font-family: 'M PLUS 1p', -apple-system, BlinkMacSystemFont, 'Hiragino Sans', sans-serif; color: var(--ink); font-size: 16px; -webkit-font-smoothing: antialiased; overscroll-behavior: none; }
  input, select, textarea, button { font: inherit; }
  /* iPhoneでキーボードが出ても画面がずれないよう、見えている範囲にぴったり固定する（CLAUDE.md「iPhoneの定石」） */
  #app { position: fixed; left: 0; right: 0; top: var(--app-top, 0px); height: var(--app-height, 100%); display: flex; flex-direction: column; padding-top: var(--safe-top); max-width: 640px; margin: 0 auto; }
  .nav { height: 52px; display: flex; align-items: center; justify-content: center; position: relative; flex-shrink: 0; }
  .nav h1 { font-size: 18px; font-weight: 800; letter-spacing: .06em; }
  .nav .r { position: absolute; right: 8px; top: 6px; border: 0; background: none; color: var(--accent); font-size: 28px; font-weight: 400; width: 44px; height: 40px; cursor: pointer; line-height: 1; }
  .view { display: none; flex: 1; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 4px 16px 24px; }
  .view.on { display: block; }
  .tabbar { flex-shrink: 0; display: flex; background: color-mix(in srgb, var(--bg) 92%, transparent); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border-top: .5px solid var(--sep); padding-bottom: var(--safe-bottom); }
  body.keyboard-open .tabbar { display: none; }
  .tabbar button { flex: 1; border: 0; background: none; padding: 8px 0 6px; display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 10.5px; font-weight: 700; color: var(--tertiary); cursor: pointer; }
  .tabbar button.on { color: var(--accent); }
  .tabbar svg { width: 25px; height: 25px; }
  .sec { font-size: 12.5px; color: var(--secondary); font-weight: 700; margin: 14px 4px 8px; }
  .sec:first-child { margin-top: 6px; }
  .note { font-size: 12px; color: var(--secondary); line-height: 1.65; margin: 8px 4px 0; }

  /* 一覧カード */
  .pl { background: var(--card); border-radius: 18px; padding: 14px 15px; margin-bottom: 10px; box-shadow: var(--shadow); cursor: pointer; }
  .pl:active { transform: scale(.99); }
  .pl-top { display: flex; align-items: center; gap: 8px; }
  .dot { width: 11px; height: 11px; border-radius: 50%; flex-shrink: 0; }
  .pl-n { font-size: 17px; font-weight: 800; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .badge { flex-shrink: 0; font-size: 11.5px; font-weight: 800; color: #fff; padding: 4px 10px; border-radius: 999px; }
  .b-ok { background: var(--ok); } .b-mid { background: var(--mid); } .b-ng { background: var(--ng); } .b-none { background: var(--tertiary); }
  .pl-l { display: flex; align-items: baseline; flex-wrap: wrap; gap: 2px 8px; margin-top: 7px; font-size: 13px; color: var(--secondary); }
  .pl-l b { font-size: 19px; color: var(--ink); font-weight: 800; font-variant-numeric: tabular-nums; }
  .fb { margin-top: 8px; font-size: 13px; line-height: 1.55; border-radius: 10px; padding: 7px 10px; font-weight: 500; }
  .fb-ok { background: var(--ok-soft); color: var(--ok-ink); } .fb-mid { background: var(--mid-soft); color: var(--mid-ink); } .fb-ng { background: var(--ng-soft); color: var(--ng-ink); } .fb-none { background: var(--field); color: var(--secondary); }
  .gauge { position: relative; height: 7px; border-radius: 4px; background: var(--field); margin-top: 11px; }
  .gauge .band { position: absolute; top: 0; bottom: 0; background: #A9DCD1; border-radius: 4px; }
  .gauge .pin { position: absolute; top: -4px; width: 4px; height: 15px; margin-left: -2px; background: var(--ink); border-radius: 2px; box-shadow: 0 0 0 2px #fff; }
  .gauge .pin.ghost { width: 9px; margin-left: -4.5px; background: #fff; border: 2.5px solid var(--ink); box-shadow: none; }
  .g-lbl { display: flex; justify-content: space-between; font-size: 10.5px; color: var(--tertiary); margin-top: 4px; }
  .empty { text-align: center; padding: 40px 20px 10px; color: var(--secondary); font-size: 14px; line-height: 1.8; }
  .ir-list { background: var(--card, #fff); border-radius: 14px; margin: 10px 0; overflow: hidden; }
  .ir-row { display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-bottom: .5px solid var(--sep); }
  .ir-row:last-child { border-bottom: 0; }
  .ir-n { flex: 1; font-weight: 700; font-size: 15px; } .ir-n small { display: block; font-weight: 500; font-size: 11.5px; color: var(--secondary); }
  .ir-row b { font-size: 17px; font-variant-numeric: tabular-nums; }
  .ir-sec { font-size: 13px; font-weight: 700; color: var(--secondary); margin: 14px 2px 4px; }
  .ir-miss { background: var(--card, #fff); border-radius: 14px; padding: 4px 14px; margin-bottom: 10px; max-height: 240px; overflow-y: auto; }
  .ir-miss div { display: flex; justify-content: space-between; gap: 10px; padding: 7px 0; border-bottom: .5px solid var(--sep); font-size: 14px; }
  .ir-miss div:last-child { border-bottom: 0; }
  .ir-miss span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ir-miss em { font-style: normal; color: var(--secondary); font-variant-numeric: tabular-nums; }
  .add-place { display: block; width: 100%; margin-top: 14px; border: 1.5px dashed var(--accent); background: var(--accent-soft); color: var(--accent); border-radius: 14px; padding: 13px; font-size: 15px; font-weight: 700; cursor: pointer; }
  .add-place:active { opacity: .6; }
  .presets { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-top: 14px; }
  .presets button { border: 1.5px solid var(--accent); background: var(--accent-soft); color: var(--accent); border-radius: 999px; padding: 8px 14px; font-size: 14px; font-weight: 700; cursor: pointer; }
  .import-bar { display: flex; align-items: center; gap: 10px; background: var(--card); border-radius: 14px; padding: 10px 12px; margin-top: 6px; box-shadow: var(--shadow); font-size: 13px; color: var(--secondary); }
  .import-bar button { margin-left: auto; flex-shrink: 0; border: 0; background: var(--accent); color: #fff; border-radius: 10px; padding: 8px 12px; font-size: 13px; font-weight: 800; cursor: pointer; }

  /* カレンダー */
  .calc { background: var(--card); border-radius: 18px; padding: 12px; box-shadow: var(--shadow); }
  .cal-h { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
  .cal-h b { font-size: 16px; font-weight: 800; }
  .cal-h button { border: 0; background: var(--field); color: var(--accent); width: 38px; height: 34px; border-radius: 10px; font-size: 20px; cursor: pointer; }
  .grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 3px; }
  .wk { text-align: center; font-size: 11px; color: var(--secondary); padding-bottom: 2px; }
  .wk.we { color: var(--tertiary); }
  .cd { aspect-ratio: 1 / 1.08; border: 0; background: none; border-radius: 10px; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; padding-top: 6px; font-size: 14px; font-weight: 700; color: var(--ink); cursor: pointer; font-variant-numeric: tabular-nums; }
  .cd.out { visibility: hidden; }
  .cd.we { color: var(--tertiary); }
  .cd.past { color: var(--secondary); }
  .cd.today { box-shadow: inset 0 0 0 2px var(--ink); }
  .cd:active { background: var(--field); }
  .cd .evs { display: flex; gap: 2px; margin-top: 4px; flex-wrap: wrap; justify-content: center; max-width: 30px; }
  .cd .ev { width: 8px; height: 8px; border-radius: 50%; }
  .cd .ev.plan { background: #fff !important; border: 2px solid; }
  .lg { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 11px; color: var(--secondary); margin-top: 10px; }
  .lg i { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 4px; vertical-align: -1px; }
  .ul { background: var(--card); border-radius: 16px; overflow: hidden; box-shadow: var(--shadow); }
  .ul .it { display: flex; align-items: center; gap: 9px; padding: 11px 14px; border-bottom: .5px solid var(--sep); font-size: 14px; cursor: pointer; white-space: nowrap; }
  .ul .it:last-child { border-bottom: 0; }
  .ul .d { font-weight: 800; font-variant-numeric: tabular-nums; }
  .ul .nm { min-width: 0; overflow: hidden; text-overflow: ellipsis; }
  .ul .g { margin-left: auto; font-size: 11.5px; color: var(--secondary); flex-shrink: 0; }
  .ul .g.plan { color: var(--accent); font-weight: 700; }

  /* 設定 */
  .list { background: var(--card); border-radius: 16px; overflow: hidden; box-shadow: var(--shadow); }
  .row { display: flex; align-items: center; gap: 10px; padding: 13px 14px; border-bottom: .5px solid var(--sep); cursor: pointer; min-height: 52px; }
  .row:last-child { border-bottom: 0; }
  .row .t { flex: 1; min-width: 0; font-size: 15px; font-weight: 700; }
  .row .t small { display: block; font-size: 12px; font-weight: 500; color: var(--secondary); margin-top: 1px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row .chev { color: var(--tertiary); font-size: 18px; }
  .row.btn { color: var(--accent); font-weight: 700; font-size: 15px; }
  .steps { counter-reset: s; padding: 4px 14px 12px; }
  .steps li { list-style: none; position: relative; padding: 9px 0 9px 30px; font-size: 13.5px; line-height: 1.6; border-bottom: .5px solid var(--sep); }
  .steps li:last-child { border-bottom: 0; }
  .steps li::before { counter-increment: s; content: counter(s); position: absolute; left: 0; top: 10px; width: 20px; height: 20px; border-radius: 50%; background: var(--accent-soft); color: var(--accent); font-size: 12px; font-weight: 800; display: flex; align-items: center; justify-content: center; }
  .steps code { background: var(--field); border-radius: 5px; padding: 1px 5px; font-family: ui-monospace, Menlo, monospace; font-size: 12px; }
  #versionLabel { text-align: center; font-size: 12px; color: var(--tertiary); margin: 22px 0 6px; }

  /* シート */
  .sheet-bg { position: fixed; inset: 0; background: rgba(20,25,40,.32); display: none; z-index: 60; }
  .sheet-bg.show { display: block; }
  .sheet { position: fixed; left: 0; right: 0; bottom: var(--kb, 0px); max-width: 640px; margin: 0 auto; max-height: calc(var(--app-height, 100vh) - 30px); overflow-y: auto; background: var(--bg); border-radius: 20px 20px 0 0; padding: 10px 16px calc(var(--kb-safe, var(--safe-bottom)) + 18px); z-index: 61; transform: translateY(105%); transition: transform .28s cubic-bezier(.32,.72,0,1); }
  .sheet.show { transform: translateY(0); }
  .grab { width: 36px; height: 5px; border-radius: 3px; background: var(--tertiary); margin: 0 auto 12px; }
  .sheet h2 { font-size: 17px; text-align: center; margin-bottom: 14px; font-weight: 800; }
  .lbl { font-size: 12.5px; color: var(--secondary); margin: 0 4px 6px; font-weight: 700; }
  .chips { display: flex; flex-wrap: wrap; gap: 7px; margin-bottom: 14px; }
  .chip { display: inline-flex; align-items: center; gap: 6px; background: var(--card); border: 1.5px solid var(--sep); border-radius: 999px; padding: 8px 13px; font-size: 14px; font-weight: 700; cursor: pointer; color: var(--ink); }
  .chip.on { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); }
  .fld { width: 100%; min-width: 0; border: 0; background: var(--card); border-radius: 12px; padding: 12px 14px; font-size: 16px; color: var(--ink); margin-bottom: 14px; -webkit-appearance: none; display: block; }
  input[type=date].fld { min-height: 48px; text-align: left; }
  .every { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; margin-bottom: 6px; }
  .every .fld { margin: 0; text-align: center; font-size: 20px; font-weight: 800; }
  .seg { display: flex; background: var(--field); border-radius: 10px; padding: 3px; }
  .seg button { border: 0; background: none; padding: 8px 14px; border-radius: 8px; font-size: 14px; font-weight: 700; color: var(--secondary); cursor: pointer; }
  .seg button.on { background: var(--card); color: var(--ink); box-shadow: var(--shadow); }
  .hint { font-size: 12px; color: var(--secondary); margin: 0 4px 14px; line-height: 1.6; }
  .colors { display: flex; gap: 10px; margin-bottom: 16px; flex-wrap: wrap; }
  .colors button { width: 34px; height: 34px; border-radius: 50%; border: 3px solid #fff; box-shadow: 0 0 0 1.5px var(--sep); cursor: pointer; }
  .colors button.on { box-shadow: 0 0 0 2.5px var(--ink); }
  .live { background: var(--card); border-radius: 14px; padding: 12px 14px; margin-bottom: 14px; }
  .live .t { font-size: 13px; color: var(--secondary); }
  .live .big { font-size: 24px; font-weight: 800; margin: 2px 0 2px; }
  .live .big small { font-size: 13px; font-weight: 700; color: var(--secondary); margin-left: 6px; }
  .primary { width: 100%; border: 0; border-radius: 14px; background: var(--accent); color: #fff; padding: 15px; font-size: 16px; font-weight: 800; cursor: pointer; }
  .primary:disabled { opacity: .4; }
  .del { width: 100%; border: 0; background: none; color: var(--red); padding: 14px; font-size: 15px; font-weight: 700; cursor: pointer; margin-top: 4px; }
  .day-ev { display: flex; align-items: center; gap: 9px; background: var(--card); border-radius: 12px; padding: 11px 12px; margin-bottom: 8px; font-size: 14px; font-weight: 700; }
  .day-ev .s { font-size: 11.5px; color: var(--secondary); font-weight: 500; }
  .day-ev button { margin-left: auto; border: 0; background: none; color: var(--red); font-size: 13px; font-weight: 700; padding: 4px 6px; cursor: pointer; }
  textarea.fld { min-height: 120px; resize: none; font-size: 14px; line-height: 1.5; }

  .toast { position: fixed; left: 50%; top: calc(var(--app-top, 0px) + var(--safe-top) + 58px); transform: translateX(-50%) translateY(-10px); opacity: 0; pointer-events: none; background: #1B2130; color: #fff; border-radius: 12px; padding: 10px 16px; font-size: 14px; z-index: 90; transition: all .25s; width: max-content; max-width: calc(100vw - 32px); line-height: 1.5; display: flex; gap: 12px; align-items: center; }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); pointer-events: auto; }
  .toast button { border: 0; background: rgba(255,255,255,.16); color: #9CC0FF; font-weight: 700; font-size: 13px; padding: 5px 10px; border-radius: 8px; }
  .toast button:empty { display: none; }
  #updateBanner { position: fixed; left: 12px; right: 12px; bottom: calc(var(--safe-bottom) + 70px); z-index: 1000; display: flex; align-items: center; justify-content: center; background: var(--accent); color: #fff; border: 0; border-radius: 14px; padding: 14px 18px; font-size: 14px; font-weight: 700; box-shadow: 0 8px 28px rgba(0,0,0,.2); cursor: pointer; transform: translateY(200%); transition: transform .35s cubic-bezier(.32,.72,0,1); }
  #updateBanner.show { transform: translateY(0); }
</style>
</head>
<body>
<div id="app">
  <div class="nav"><h1 id="navTitle">NEXTAL</h1><button class="r" id="navAdd" aria-label="予定を入れる">＋</button></div>
  <div class="view on" id="homeView"></div>
  <div class="view" id="calView"></div>
  <div class="view" id="setView"></div>
  <nav class="tabbar">
    <button data-tab="homeView" class="on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h10"/></svg>一覧</button>
    <button data-tab="calView"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="15.5" rx="2.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/><circle cx="9" cy="15" r="1.3" fill="currentColor"/><circle cx="15.5" cy="15" r="1.6"/></svg>カレンダー</button>
    <button data-tab="setView"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>設定</button>
  </nav>
</div>
<div class="sheet-bg" id="sheetBg"></div>
<div class="sheet" id="sheet"></div>
<div class="toast" id="toast"><span></span><button></button></div>
<input type="file" id="importFile" accept="application/json,.json" style="display:none" />

<script>
  const APP_VERSION = '1.4.0';
  const $ = (s, r = document) => r.querySelector(s);
  const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
  const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
  const esc = (t) => String(t).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const pad = (n) => String(n).padStart(2, '0');
  const ymd = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
  const parse = (s) => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
  const todayStr = () => ymd(new Date());
  const WD = ['日', '月', '火', '水', '木', '金', '土'];
  const md = (s) => { const d = parse(s); return `${d.getMonth() + 1}/${d.getDate()}`; };
  const mdw = (s) => `${md(s)}（${WD[parse(s).getDay()]}）`;
  const daysBetween = (a, b) => Math.round((parse(b) - parse(a)) / 86400000);
  const addDays = (s, n) => { const d = parse(s); d.setDate(d.getDate() + n); return ymd(d); };
  const COLORS = ['#E56B9F', '#3FA36B', '#2F6FDB', '#8B6BD6', '#F08A24', '#1BA6B8', '#7A7F8C'];
  const UNIT_DAYS = { d: 1, w: 7, m: 30 };
  const UNIT_LABEL = { d: '日', w: '週', m: 'か月' };

  // ---------- IndexedDB ----------
  const DB_NAME = 'nextal-db', DB_VER = 1;
  let db = null;
  function openDB() {
    return new Promise((res, rej) => {
      const r = indexedDB.open(DB_NAME, DB_VER);
      r.onupgradeneeded = () => { const d = r.result; for (const s of ['places', 'visits']) if (!d.objectStoreNames.contains(s)) d.createObjectStore(s, { keyPath: 'id' }); };
      r.onsuccess = () => { db = r.result; res(db); };
      r.onerror = () => rej(r.error);
    });
  }
  const tx = (s, m) => db.transaction(s, m).objectStore(s);
  const getAll = (s) => new Promise((res, rej) => { const r = tx(s, 'readonly').getAll(); r.onsuccess = () => res(r.result || []); r.onerror = () => rej(r.error); });
  const put = (s, v) => new Promise((res, rej) => { const r = tx(s, 'readwrite').put(v); r.onsuccess = () => res(); r.onerror = () => rej(r.error); });

  const state = { places: [], visits: [], calMonth: todayStr().slice(0, 7), tab: 'homeView' };
  async function loadAll() {
    state.places = (await getAll('places')).filter((p) => !p.deleted).sort((a, b) => (a.order || 0) - (b.order || 0));
    state.visits = (await getAll('visits')).filter((v) => !v.deleted);
  }
  const placeById = (id) => state.places.find((p) => p.id === id);
  const visitsOf = (pid) => state.visits.filter((v) => v.placeId === pid).sort((a, b) => a.date < b.date ? -1 : 1);

  // ---------- 間隔の計算 ----------
  // ちょうどいい間隔＝目安の前後2割（最低でも前後1日）
  function band(p) {
    const t = p.every * UNIT_DAYS[p.unit];
    const w = Math.max(1, Math.round(t * 0.2));
    return { t, lo: t - w, hi: t + w };
  }
  function fmtGap(n) {
    if (n < 14) return `${n}日`;
    if (n < 120) { const w = Math.floor(n / 7), r = n % 7; return r ? `${w}週${r}日` : `${w}週`; }
    return `約${Math.round(n / 30.4 * 2) / 2}か月`;
  }
  const half = (n) => Math.round(n * 2) / 2;
  // 差の日数を、その場所の単位に合わせて言う（か月ごとの場所は「約1か月」）
  const fmtDiff = (p, n) => p.unit === 'm' && n >= 30 ? `約${half(n / 30)}か月` : fmtGap(n);
  const everyLabel = (p) => `${p.every}${UNIT_LABEL[p.unit]}ごと`;
  const bandLabel = (p) => {
    const b = band(p);
    if (p.unit === 'd' || b.hi < 28) return `${b.lo}〜${b.hi}日`;
    if (p.unit === 'w' && half(b.lo / 7) !== half(b.hi / 7)) return `${half(b.lo / 7)}〜${half(b.hi / 7)}週`;
    if (p.unit === 'm' && half(b.lo / 30) !== half(b.hi / 30)) return `${half(b.lo / 30)}〜${half(b.hi / 30)}か月`;
    return `${b.lo}〜${b.hi}日`;
  };
  // ある日付に予定を入れたときの評価
  function judgeGap(p, gap) {
    const b = band(p);
    if (gap < b.lo) return { lv: 'mid', label: '少し短め', msg: `目安（${bandLabel(p)}）より${fmtDiff(p, b.lo - gap)}短め` };
    if (gap <= b.hi) return { lv: 'ok', label: 'ちょうどいい', msg: `目安（${bandLabel(p)}）の範囲です` };
    if (gap <= b.t * 1.5) return { lv: 'mid', label: '少し長め', msg: `目安（${bandLabel(p)}）より${fmtDiff(p, gap - b.hi)}長め` };
    return { lv: 'ng', label: 'あきすぎ', msg: `目安（${bandLabel(p)}）より${fmtDiff(p, gap - b.hi)}長くなります` };
  }
  // 場所ごとのいまの状態
  function status(p, today = todayStr()) {
    const vs = visitsOf(p.id);
    // 今日の予約は「次の予約（今日）」として扱い、明日から「行った」になる
    const past = vs.filter((v) => v.date < today), fut = vs.filter((v) => v.date >= today);
    const last = past.length ? past[past.length - 1].date : null;
    const next = fut.length ? fut[0].date : null;
    const b = band(p);
    const s = { p, last, next, b, gaps: [] };
    for (let i = 1; i < past.length; i++) s.gaps.push(daysBetween(past[i - 1].date, past[i].date));
    if (next) {
      s.until = daysBetween(today, next);
      if (last) { s.gap = daysBetween(last, next); Object.assign(s, judgeGap(p, s.gap)); s.msg = `前回から${fmtGap(s.gap)}。` + (s.lv === 'ok' ? 'いつもどおりの間隔です。' : s.msg + '。'); }
      else { s.lv = 'ok'; s.label = '予約あり'; s.msg = 'はじめての記録です。'; }
    } else if (last) {
      s.since = daysBetween(last, today);
      s.winFrom = addDays(last, b.lo); s.winTo = addDays(last, b.hi);
      if (s.since < b.lo) { s.lv = 'none'; s.label = '予約なし'; s.msg = `目安まであと${fmtDiff(p, b.lo - s.since)}。${mdw(s.winFrom)}〜${mdw(s.winTo)}がちょうどいい日です。`; }
      else if (s.since <= b.hi) { s.lv = 'mid'; s.label = '予約なし'; s.msg = `ちょうどいい時期です。${mdw(s.winTo)}までに行けると、いつもの間隔です。`; }
      else { s.lv = 'ng'; s.label = '予約なし'; s.msg = `目安を${fmtDiff(p, s.since - b.hi)}すぎています。そろそろ予約を。`; }
    } else { s.lv = 'none'; s.label = '記録なし'; s.msg = 'まだ記録がありません。カレンダーから取り込むか、＋で予定を入れてください。'; }
    return s;
  }
  // ゲージ：0〜目安の1.6倍を横幅に。帯＝ちょうどいい範囲、針＝いまの経過（予約ありなら白抜きの針＝次の予約）
  function gaugeHTML(s) {
    if (!s.last) return '';
    const max = Math.max(s.b.hi * 1.4, (s.gap || s.since || 0) * 1.05);
    const pc = (n) => Math.min(100, Math.max(0, n / max * 100));
    const val = s.next ? s.gap : s.since;
    return `<div class="gauge"><div class="band" style="left:${pc(s.b.lo)}%;width:${pc(s.b.hi) - pc(s.b.lo)}%"></div><div class="pin${s.next ? ' ghost' : ''}" style="left:${pc(val)}%"></div></div>
      <div class="g-lbl"><span>前回 ${md(s.last)}</span><span>ちょうどいい ${bandLabel(s.p)}</span></div>`;
  }

  // ---------- 一覧 ----------
  function renderHome() {
    const el = $('#homeView');
    if (!state.places.length) {
      el.innerHTML = `<div class="empty">通っている場所（美容院・整骨院・病院など）を登録しましょう。<br>あとで名前も間隔も変えられます。</div>
        <button class="add-place" data-preset="new">＋ 通う場所を追加</button>`;
      return;
    }
    const ss = state.places.map((p) => status(p));
    const need = ss.filter((s) => !s.next).sort((a, b) => ({ ng: 0, mid: 1, none: 2 }[a.lv] - { ng: 0, mid: 1, none: 2 }[b.lv]) || ((b.since || 0) - (a.since || 0)));
    const have = ss.filter((s) => s.next).sort((a, b) => a.until - b.until);
    const card = (s) => `<div class="pl" data-place="${s.p.id}">
      <div class="pl-top"><span class="dot" style="background:${s.p.color}"></span><span class="pl-n">${esc(s.p.name)}</span><span class="badge b-${s.lv}">${s.label}</span></div>
      ${s.next ? `<div class="pl-l">${s.until === 0 ? '今日は' : '次は'}<b>${mdw(s.next)}</b><span>${s.until === 0 ? '予約の日' : `あと${s.until}日`}</span></div>`
        : s.last ? `<div class="pl-l">前回から<b>${fmtGap(s.since)}</b><span>／目安 ${everyLabel(s.p)}</span></div>` : ''}
      ${s.next ? '' : gaugeHTML(s)}
      <div class="fb fb-${s.lv}">${esc(s.msg)}</div></div>`;
    let html = '';
    if (need.length) html += `<div class="sec">予約が入っていないもの</div>` + need.map(card).join('');
    if (have.length) html += `<div class="sec">予約が入っているもの</div>` + have.map(card).join('');
    html += `<div class="import-bar"><span>${importedText()}</span><button data-import>カレンダーから取り込む</button></div>`;
    html += `<button class="add-place" data-preset="new">＋ 通う場所を追加</button>`;

  function importedText() {
    let t = 0; try { t = Number(localStorage.getItem('nextal.lastImportAt') || 0); } catch (e) {}
    if (!t) return 'Googleカレンダーの予約をまとめて取り込めます';
    const d = Math.floor((Date.now() - t) / 86400000);
    return `前回の取り込み：${d === 0 ? '今日' : d + '日前'}`;
  }

      await put('places', Object.assign({}, p, { deleted: true, updatedAt: Date.now() }));

  // 予定を入れる（日付が決まっていれば その日、場所が決まっていれば その場所）
  function openAddSheet(date, placeId) {
    if (!state.places.length) { openPlaceSheet(null); return; }
    let pid = placeId || null;
    let d = date || null;
    if (!d && pid) { const s = status(placeById(pid)); d = s.winTo && s.winTo > todayStr() ? s.winFrom > todayStr() ? s.winFrom : todayStr() : addDays(todayStr(), 7); }
    if (!d) d = addDays(todayStr(), 7);

      if (!dayList.length) $('#adTitle').textContent = dd ? (dd < todayStr() ? '行った日を入れる' : '予定を入れる') : '予定を入れる';
      $('#adSave').disabled = !(pid && dd);

      if (!prev) { box.innerHTML = `<div class="t">${esc(p.name)}ははじめての記録です</div>`; return; }
      const gap = daysBetween(prev.date, dd), j = judgeGap(p, gap), b = band(p);
      const hint = j.lv === 'ok' ? '' : gap > b.hi ? `${mdw(addDays(prev.date, b.hi))}までに入れると、いつもの間隔に戻せます。` : `${mdw(addDays(prev.date, b.lo))}以降にすると、ちょうどよくなります。`;
      const max = Math.max(b.hi * 1.4, gap * 1.05), pc = (n) => Math.min(100, n / max * 100);
      box.innerHTML = `<div class="t">前回（${mdw(prev.date)}）から</div><div class="big">${fmtGap(gap)}<small>${gap}日</small></div>
        <div class="gauge"><div class="band" style="left:${pc(b.lo)}%;width:${pc(b.hi) - pc(b.lo)}%"></div><div class="pin ghost" style="left:${pc(gap)}%"></div></div>
        <div class="g-lbl"><span>ちょうどいい ${bandLabel(p)}</span><span></span></div>

  // ---------- カレンダーから取り込む ----------
  // 1行に「日付 タイトル」。日付は 2026-10-03 / 2026/10/3 / 2026年10月3日 のどれでも
  function parseLines(text) {
    const out = [];
    for (const line of String(text).split(/\r?\n/)) {
      const m = line.match(/(\d{4})[-\/年.](\d{1,2})[-\/月.](\d{1,2})日?/);
      if (!m) continue;
      const date = `${m[1]}-${pad(+m[2])}-${pad(+m[3])}`;
      const title = line.slice(m.index + m[0].length).replace(/^[\s\t:：,、|-]+/, '').replace(/^\d{1,2}:\d{2}\s*/, '').trim();
      out.push({ date, title });
    }
    return out;
  }
  const norm = (s) => String(s || '').normalize('NFKC').toLowerCase();
  function matchPlace(title) {
    const t = norm(title);
    for (const p of state.places) {
      const keys = norm(p.keyword).split(/[、,，\s]+/).map((k) => k.trim()).filter(Boolean);
      if (keys.some((k) => t.includes(k))) return p;
    }
    return null;
  }
  async function importText(text) {
    const lines = parseLines(text);
    if (!lines.length) { toast('予定が見つかりませんでした。ショートカットでコピーしてから押してください'); return; }
    const from = lines.reduce((a, l) => l.date < a ? l.date : a, lines[0].date), to = lines.reduce((a, l) => l.date > a ? l.date : a, lines[0].date);
    const found = new Map();   // placeId|date
    for (const l of lines) { const p = matchPlace(l.title); if (p) found.set(p.id + '|' + l.date, { placeId: p.id, date: l.date }); }
    const all = await getAll('visits');
    const key = (v) => v.placeId + '|' + v.date;
    const existing = new Map(all.map((v) => [key(v), v]));
    let added = 0, removed = 0;
    for (const [k, f] of found) {
      const e = existing.get(k);
      if (!e) { await put('visits', { id: uid(), placeId: f.placeId, date: f.date, src: 'cal', updatedAt: Date.now() }); added++; }
      // 取り込みで消えた予約がカレンダーに戻ってきたら、戻す（手で消したものは戻さない）
      else if (e.deleted && e.goneByImport) { await put('visits', Object.assign({}, e, { deleted: false, goneByImport: false, updatedAt: Date.now() })); added++; }
      // 手で消したもの（deleted）はそのまま。手で入れたものは「カレンダーにもある」に切り替える
      else if (!e.deleted && e.src !== 'cal') await put('visits', Object.assign({}, e, { src: 'cal', updatedAt: Date.now() }));
    }
    // 1件も一致しなかったときは、コピーした内容が違う可能性が高いので何も消さない
    if (!found.size) { showImportResult(lines, found, 0, 0, from, to); return; }
    // 取り込んだ範囲の中で、カレンダーから来たのにもう無いもの（予約を消した・日付を変えた）は消す
    for (const v of all) {
      if (v.deleted || v.src !== 'cal' || v.date < from || v.date > to) continue;
      if (!found.has(key(v))) { await put('visits', Object.assign({}, v, { deleted: true, goneByImport: true, updatedAt: Date.now() })); removed++; }
    }
    try { localStorage.setItem('nextal.lastImportAt', String(Date.now())); } catch (e) {}
    await loadAll(); renderAll();
    showImportResult(lines, found, added, removed, from, to);
  }
  // 取り込みの結果：読んだ件数・期間・場所ごとの件数と、どれにも当てはまらなかった予定のタイトル（探す言葉の見直し用）
  function showImportResult(lines, found, added, removed, from, to) {
    const per = new Map();
    for (const f of found.values()) per.set(f.placeId, (per.get(f.placeId) || 0) + 1);
    const miss = new Map();
    for (const l of lines) { if (!l.title || matchPlace(l.title)) continue; const k = l.title.trim(); miss.set(k, (miss.get(k) || 0) + 1); }
    const top = [...miss.entries()].sort((a, b) => b[1] - a[1]).slice(0, 15);
    const ymdJ = (s) => s.replace(/^(\d{4})-0?(\d+)-0?(\d+)$/, '$1/$2/$3');
    openSheet(`<h2>${found.size ? '取り込みました' : '一致する予定がありませんでした'}</h2>
      <div class="hint">コピーされていた予定：<b>${lines.length}件</b>（${ymdJ(from)} 〜 ${ymdJ(to)}）${found.size ? `<br>このうち登録した場所に当てはまったもの：<b>${found.size}件</b>（新しく${added}件${removed ? `・なくなった${removed}件` : ''}）` : ''}</div>
      <div class="ir-list">${state.places.map((p) => `<div class="ir-row"><span class="dot" style="background:${p.color}"></span><span class="ir-n">${esc(p.name)}<small>探す言葉：${esc(p.keyword || '（未設定）')}</small></span><b>${per.get(p.id) || 0}件</b></div>`).join('')}</div>
      ${top.length ? `<div class="ir-sec">当てはまらなかった予定（多い順）</div><div class="hint" style="margin-top:0">通っている場所の予定がこの中にあれば、そのタイトルの一部を「探す言葉」に足してください（「、」で区切って複数入れられます）。</div>
      <div class="ir-miss">${top.map(([t, n]) => `<div><span>${esc(t)}</span><em>${n}</em></div>`).join('')}</div>` : ''}
      <div class="hint">過去の予定が少ないときは、iPhoneの設定 → カレンダー → 同期 を「すべてのイベント」にしてください。</div>
      <button class="primary" id="irOk">OK</button>`);
    $('#irOk').addEventListener('click', closeSheet);
  }
  async function importFromClipboard() {
    try {
      const t = await navigator.clipboard.readText();
      await importText(t);
    } catch (e) { openPasteSheet(); }
  }
  function openPasteSheet() {
    openSheet(`<h2>貼り付けて取り込む</h2>
      <div class="hint">ショートカットでコピーした内容を、下の欄に長押しで貼り付けてください。</div>
      <textarea class="fld" id="pasteBox" placeholder="2026-10-03 春日整骨院&#10;2026-11-08 美容院" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false"></textarea>
      <button class="primary" id="pasteGo">取り込む</button>`);
    $('#pasteGo').addEventListener('click', async () => { const t = $('#pasteBox').value; closeSheet(); await importText(t); });
  }

  // ---------- 操作 ----------
  function switchTab(id) {
    state.tab = id;
    $$('.view').forEach((v) => v.classList.toggle('on', v.id === id));
    $$('.tabbar button').forEach((b) => b.classList.toggle('on', b.dataset.tab === id));
    $('#navTitle').textContent = id === 'calView' ? 'カレンダー' : id === 'setView' ? '設定' : 'NEXTAL';
    $('#navAdd').style.visibility = id === 'setView' ? 'hidden' : '';
    $('#' + id).scrollTop = 0;
  }
  $('.tabbar').addEventListener('click', (e) => { const b = e.target.closest('[data-tab]'); if (b) switchTab(b.dataset.tab); });
  $('#navAdd').addEventListener('click', () => openAddSheet(state.tab === 'calView' && state.calMonth !== todayStr().slice(0, 7) ? state.calMonth + '-01' : null));
  document.addEventListener('click', async (e) => {
    const t = e.target.closest('[data-preset],[data-place],[data-day],[data-cal],[data-edit],[data-import],[data-paste],#exportBtn,#importBtn');
    if (!t || t.closest('#sheet')) return;
    if (t.dataset.preset) return openPlaceSheet(null);
    if (t.dataset.place) return openAddSheet(null, t.dataset.place);
    if (t.dataset.day) return openAddSheet(t.dataset.day);
    if (t.dataset.cal) { const [y, m] = state.calMonth.split('-').map(Number); const d = new Date(y, m - 1 + Number(t.dataset.cal), 1); state.calMonth = `${d.getFullYear()}-${pad(d.getMonth() + 1)}`; return renderCal(); }
    if (t.dataset.edit) return openPlaceSheet(t.dataset.edit === 'new' ? null : t.dataset.edit);
    if (t.hasAttribute('data-import')) return importFromClipboard();
    if (t.hasAttribute('data-paste')) return openPasteSheet();
    if (t.id === 'exportBtn') return exportData();
    if (t.id === 'importBtn') return $('#importFile').click();
  });
  function renderAll() { renderHome(); renderCal(); renderSet(); }

  // ---------- トースト（alert/confirm は使わない） ----------
  let toastT = 0;
  function toast(msg, label, fn) {
    const t = $('#toast'); t.querySelector('span').textContent = msg;
    const b = t.querySelector('button'); b.textContent = label || ''; b.onclick = fn ? () => { t.classList.remove('show'); fn(); } : null;
    t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), fn ? 5000 : 2600);
  }

  // ---------- バックアップ（全アプリ共通の作法） ----------
  function bkName(app) { const d = new Date(); return `${app}_${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}.json`; }
  // iPhoneの共有シートは、保存できても「キャンセル」と返すことがある。そのときは本人に聞く。
  function bkAskSaved() {
    return new Promise((resolve) => {
      const bg = document.createElement('div');
      bg.style.cssText = 'position:fixed;inset:0;z-index:9500;background:rgba(0,0,0,.32);display:flex;align-items:center;justify-content:center;padding:24px;font-family:inherit';
      bg.innerHTML = '<div style="width:100%;max-width:330px;background:#fff;color:#1c1c1e;border-radius:18px;padding:20px 20px 12px;box-shadow:0 12px 40px rgba(0,0,0,.2)">' +
        '<div style="font-size:16px;font-weight:700;margin-bottom:6px">バックアップは保存できましたか？</div>' +
        '<div style="font-size:14px;line-height:1.6;color:#6e6e73">保存できていれば、バックアップのお知らせを消します。</div>' +
        '<div style="display:flex;justify-content:flex-end;gap:4px;margin-top:12px">' +
        '<button data-v="0" style="border:0;background:none;font:inherit;font-size:15px;padding:10px 12px;color:#6e6e73">やめた</button>' +
        '<button data-v="1" style="border:0;background:none;font:inherit;font-size:15px;font-weight:700;padding:10px 12px;color:#007aff">保存できた</button></div></div>';
      bg.addEventListener('click', (e) => { const b = e.target.closest('button[data-v]'); if (!b) return; bg.remove(); resolve(b.dataset.v === '1'); });
      document.body.appendChild(bg);
    });
  }
  async function bkSave(app, text) {
    const name = bkName(app);
    if (navigator.maxTouchPoints > 0) {
      try {
        const file = new File([text], name, { type: 'application/json' });
        if (navigator.canShare && navigator.share && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file] }); return 'ok'; }
      } catch (e) { if (e && e.name === 'AbortError') return (await bkAskSaved()) ? 'ok' : 'cancel'; }
    }
    const url = URL.createObjectURL(new Blob([text], { type: 'application/json' }));
    const a = document.createElement('a'); a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 1500);
    return 'ok';
  }
  const BK_KEY = 'nextal.lastBackupAt', SCHEMA = 'nextal.v1';
  function bkText() { let t = 0; try { t = Number(localStorage.getItem(BK_KEY) || 0); } catch (e) {} if (!t) return 'まだ一度もバックアップしていません'; const d = Math.floor((Date.now() - t) / 86400000); return d === 0 ? '前回のバックアップ：今日' : '前回のバックアップから ' + d + '日'; }
  async function exportData() {
    const data = { schema: SCHEMA, exportedAt: new Date().toISOString(), places: await getAll('places'), visits: await getAll('visits') };
    if (await bkSave('NEXTAL', JSON.stringify(data, null, 2)) !== 'ok') return;
    try { localStorage.setItem(BK_KEY, String(Date.now())); } catch (e) {}
    renderSet(); toast('書き出しました');
  }
  $('#importFile').addEventListener('change', async (e) => {
    const f = e.target.files[0]; e.target.value = ''; if (!f) return;
    try {
      const data = JSON.parse(await f.text());
      if (data.schema !== SCHEMA) { toast('NEXTALのデータではないようです'); return; }
      let n = 0;
      for (const [store, list] of [['places', data.places], ['visits', data.visits]]) {
        const cur = new Map((await getAll(store)).map((x) => [x.id, x]));
        for (const it of (list || [])) { const l = cur.get(it.id); if (!l || (it.updatedAt || 0) > (l.updatedAt || 0)) { await put(store, it); n++; } }
      }
      await loadAll(); renderAll(); toast(n + '件 取り込みました');
    } catch (err) { toast('取り込めませんでした'); }
  });

  // ---------- visualViewport（キーボード対策：CLAUDE.md「iPhoneの定石」） ----------
  function setupViewportTracking() {
    const vv = window.visualViewport; if (!vv) return;
    const root = document.documentElement; let baseH = vv.height, lastH = -1, lastT = -1, lastKb = -1;
    function apply() {
      const h = Math.round(vv.height), t = Math.max(0, Math.round(vv.offsetTop));
      if (h !== lastH) { root.style.setProperty('--app-height', h + 'px'); lastH = h; }
      if (t !== lastT) { root.style.setProperty('--app-top', t + 'px'); lastT = t; }
      const kb = Math.max(0, Math.round(window.innerHeight - vv.height - vv.offsetTop));
      if (kb !== lastKb) { root.style.setProperty('--kb', kb + 'px'); root.style.setProperty('--kb-safe', kb > 40 ? '0px' : 'var(--safe-bottom)'); lastKb = kb; }
      document.body.classList.toggle('keyboard-open', h < baseH - 120);
    }
    let until = 0, looping = false;
    function follow(ms) {
      until = Math.max(until, performance.now() + ms);
      if (looping) return; looping = true;
      const tick = () => { apply(); const typing = document.activeElement && /^(INPUT|TEXTAREA)$/.test(document.activeElement.tagName); if (typing || performance.now() < until) requestAnimationFrame(tick); else looping = false; };
      requestAnimationFrame(tick);
    }
    vv.addEventListener('resize', () => follow(600)); vv.addEventListener('scroll', () => follow(600));
    document.addEventListener('focusin', (e) => {
      follow(1200);
      const el = e.target;
      if (el && el.closest && el.closest('#sheet') && el.type !== 'date') [350, 700].forEach((ms) => setTimeout(() => { if (document.activeElement === el) el.scrollIntoView({ block: 'center', behavior: 'smooth' }); }, ms));
    });
    document.addEventListener('focusout', () => follow(1200));
    window.addEventListener('orientationchange', () => setTimeout(() => { baseH = vv.height; follow(600); }, 300));
    apply();
  }
  // 日本語変換の確定Enterで送信しない（入力欄では Enter を無視するだけ）
  document.addEventListener('keydown', (e) => { if (e.key === 'Enter' && e.target.tagName === 'INPUT' && (e.isComposing || e.keyCode === 229)) e.preventDefault(); });

  // ---------- 起動 ----------
  (async function init() {
    setupViewportTracking();
    await openDB(); await loadAll(); renderAll(); switchTab('homeView');
    // 日付が変わったら描き直す
    let last = todayStr();
    document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && todayStr() !== last) { last = todayStr(); renderAll(); } });
  })();

  // ---------- Service Worker + 自動アップデート ----------
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', async () => {
      try {
        const res = await fetch(new URL('sw.js', location.href).href, { method: 'HEAD' }); if (!res.ok) return;
        const reg = await navigator.serviceWorker.register('sw.js');
        if (reg.waiting && navigator.serviceWorker.controller) showUpdateBanner(reg.waiting);
        reg.addEventListener('updatefound', () => { const sw = reg.installing; if (!sw) return; sw.addEventListener('statechange', () => { if (sw.state === 'installed' && navigator.serviceWorker.controller) showUpdateBanner(sw); }); });
        reg.update();
        document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') reg.update(); });
        let refreshing = false;
        navigator.serviceWorker.addEventListener('controllerchange', () => { if (refreshing) return; refreshing = true; window.location.reload(); });
      } catch (e) {}
    });
  }
  function showUpdateBanner(waitingSW) {
    if (document.getElementById('updateBanner')) return;
    const b = document.createElement('button'); b.id = 'updateBanner';
    b.innerHTML = '<span>新しいバージョンがあります — タップで更新</span>';
    b.addEventListener('click', () => { b.disabled = true; b.querySelector('span').textContent = '更新中…'; waitingSW.postMessage('SKIP_WAITING'); });
    document.body.appendChild(b); requestAnimationFrame(() => b.classList.add('show'));
  }
</script>
</body>
</html>
